# ============================================================
#  Gate.io 永续合约量化交易系统 - 主配置文件
#  修改说明：所有参数均在此文件中集中管理，重启程序后生效
# ============================================================

# ──────────────────────────────────────────────────────────
#  Gate.io API 连接配置
# ──────────────────────────────────────────────────────────
api:
  # API 访问地址（生产环境）
  base_url: "https://api.gateio.ws/api/v4"

  # 你的 Gate.io API Key（在官网 > 账户 > API 管理中创建）
  # ⚠️ 敏感信息：请通过环境变量 GATE_API_KEY 设置，不要直接写在文件中
  key: ${GATE_API_KEY:}

  # 你的 Gate.io API Secret
  # ⚠️ 敏感信息：请通过环境变量 GATE_API_SECRET 设置，不要直接写在文件中
  secret: ${GATE_API_SECRET:}

  # HTTP 请求超时（秒）
  connect_timeout_sec: 10
  read_timeout_sec: 30
  write_timeout_sec: 30

# ──────────────────────────────────────────────────────────
#  交易标的配置
# ──────────────────────────────────────────────────────────
trading:
  # 结算币种：usdt = U本位（USDT保证金）；btc = 币本位
  settle: "usdt"

  # 参与交易的合约列表（可添加多个，程序会为每个合约独立运行策略线程）
  contracts:
    - "DOGE_USDT"     # 比特币永续合约（默认）
    # - "ETH_USDT"   # 以太坊永续合约（取消注释即可启用）
    # - "SOL_USDT"   # Solana 永续合约

  # 是否启用实盘下单（true=真实下单；false=仅模拟信号，不实际下单）
  live_trading: true

  # ── 仓位与风控 ──
  # 每笔开仓使用的 USDT 金额（使用账户可用余额的百分比）
  # 例如：账户 1000 USDT，position_pct=0.1 则每次开仓使用 100 USDT
  position_pct: 0.1

  # 合约杠杆倍数（1-100，请根据风险承受能力设置）
  leverage: 2

  # 止损比例（相对于开仓价格的亏损百分比；0.05 = 5%）
  stop_loss_pct: 0.07

  # 止盈比例（相对于开仓价格的盈利百分比；0.10 = 10%）
  take_profit_pct: 0.15

  # ── 策略执行频率 ──
  # 策略轮询间隔（秒）：每隔多少秒抓取一次 K 线并计算指标
  poll_interval_sec: 60

  # K 线周期（用于指标计算）：1m / 5m / 15m / 30m / 1h / 4h / 1d
  kline_interval: "15m"

  # 每次获取的 K 线根数（至少需要 >= 指标计算所需的最大周期数，建议 200）
  kline_limit: 200

# ──────────────────────────────────────────────────────────
#  技术指标参数配置
# ──────────────────────────────────────────────────────────
indicator:
  # ── MACD 参数 ──
  macd:
    # 快线周期（EMA）
    fast_period: 12
    # 慢线周期（EMA）
    slow_period: 26
    # 信号线周期
    signal_period: 9

  # ── KD 随机指标参数（Stochastic Oscillator）──
  kd:
    # K 值计算周期（RSV 的滚动窗口）
    k_period: 9
    # D 值平滑周期（对 K 值的 SMA）
    d_period: 3
    # 超卖线（金叉判断：K 和 D 都需从此线下方穿越）
    oversold_level: 20

  # ── RSI 参数 ──
  rsi:
    # RSI 计算周期
    period: 14
    # 超买线（RSI 跌破此线时触发卖出信号）
    overbought_level: 70
    # RSI 顶背离检测窗口（回溯多少根 K 线来判断价格新高但 RSI 没新高）
    divergence_lookback: 5

# ──────────────────────────────────────────────────────────
#  回测配置
# ──────────────────────────────────────────────────────────
backtest:
  # 回测默认周期（天数，从当前时间往前算）
  default_days: 7

  # 回测初始资金（USDT）
  initial_capital: 10000.0

  # 回测使用的 K 线周期（与 trading.kline_interval 保持一致为佳）
  kline_interval: "15m"

  # 回测手续费率（单边，例如 0.0005 = 0.05%）
  commission_rate: 0.0005

# ──────────────────────────────────────────────────────────
#  MySQL 数据库配置
# 程序使用 MySQL 数据库存储交易记录和K线数据
# 请正确配置以下连接信息，否则程序无法启动
# ──────────────────────────────────────────────────────────
database:
  # 数据库连接（请根据实际情况修改）
  host: "localhost"
  port: 3306
  name: "quant_trader"
  username: "root"
  password: "Kevin@1124"

  # 连接池配置（HikariCP）
  pool:
    # 连接池最小空闲连接数
    minimum_idle: 5
    # 连接池最大连接数
    maximum_pool_size: 20
    # 连接最大生存时间（毫秒）
    max_lifetime: 1800000
    # 连接超时（毫秒）
    connection_timeout: 30000
    # 空闲超时（毫秒）
    idle_timeout: 600000

# ──────────────────────────────────────────────────────────
#  日志配置（更详细的日志格式在 logback.xml 中配置）
# ──────────────────────────────────────────────────────────
logging:
  # 日志级别：TRACE / DEBUG / INFO / WARN / ERROR
  level: "INFO"

  # 日志文件目录（相对于程序运行目录）
  log_dir: "logs"

  # 单个日志文件最大体积（MB）
  max_file_size_mb: 50

  # 日志文件最大保留天数
  max_history_days: 30
